name: Quality

on:
  push:
  pull_request:

jobs:
  test:
    name: PHP tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate bootstrap script syntax
        run: bash -n scripts/bootstrap.sh

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, fileinfo, curl, pdo_sqlite, sqlite3, xml
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test

# Android APK packaging is added once an emulator/device build is verified (T2/T10).
