name: Android build

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-release:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, fileinfo, curl, pdo_sqlite, sqlite3, xml, zip
          coverage: none

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          accept-android-sdk-licenses: false

      - name: Install Android platform and build tools
        run: |
          if ! command -v android >/dev/null 2>&1; then
            echo "Android CLI is not available; setup-android did not install cmdline-tools." >&2
            exit 1
          fi

          android sdk install platform-tools platforms/android-36 build-tools/36.0.0

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

          # Release builds: no debug pages or debug-only log detail on the phone.
          sed -i "s/^APP_ENV=.*/APP_ENV=production/" .env
          sed -i "s/^APP_DEBUG=.*/APP_DEBUG=false/" .env
          sed -i "s/^LOG_LEVEL=.*/LOG_LEVEL=info/" .env

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-ci${GITHUB_RUN_NUMBER}"
          fi
          sed -i "s/^NATIVEPHP_APP_VERSION=.*/NATIVEPHP_APP_VERSION=${VERSION}/" .env
          sed -i "s/^NATIVEPHP_APP_VERSION_CODE=.*/NATIVEPHP_APP_VERSION_CODE=${{ github.run_number }}/" .env

          php artisan native:install android --no-interaction

      - name: Prepare signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "Missing ANDROID_KEYSTORE_BASE64. Tag releases require the stable signing secrets." >&2
            exit 1
          fi

          KEYSTORE="$RUNNER_TEMP/fixit-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"

          {
            echo "KEYSTORE_PATH=$KEYSTORE"
            echo "KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Validate signing key
        run: |
          keytool -list -v \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" | grep -E "Alias name|Owner|Valid from" || true

          keytool -certreq \
            -alias "$KEY_ALIAS" \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -file "$RUNNER_TEMP/fixit-ci.csr"

          rm -f "$RUNNER_TEMP/fixit-ci.csr"

      - name: Build signed release APK
        run: |
          php artisan native:package android \
            --build-type=release \
            --keystore="$KEYSTORE_PATH" \
            --keystore-password="$STORE_PASSWORD" \
            --key-alias="$KEY_ALIAS" \
            --key-password="$KEY_PASSWORD" \
            --output=build/android \
            --no-tty \
            --no-interaction

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs build/android/app-release.apk

      - name: Create APK checksum
        run: |
          sha256sum build/android/app-release.apk > build/android/app-release.apk.sha256

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fixit-android-build-${{ github.run_number }}
          path: |
            build/android/app-release.apk
            build/android/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APK="build/android/app-release.apk"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK" "$APK.sha256" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK" "$APK.sha256" \
              --title "FixIt $VERSION" \
              --notes "Signed FixIt release $VERSION. See docs/JUDGE_GUIDE.md. Never share API keys." \
              --latest
          fi
