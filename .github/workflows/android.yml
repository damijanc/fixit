name: Android release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  android-release:
    name: Signed release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, fileinfo, curl, pdo_sqlite, sqlite3, xml, zip
          coverage: none

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android platform and build tools
        run: |
          if command -v android >/dev/null 2>&1; then
            yes | android sdk install platform-tools platforms/android-36 build-tools/36.0.0
          else
            yes | sdkmanager --licenses > /dev/null || true
            sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          fi

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^NATIVEPHP_APP_VERSION=.*/NATIVEPHP_APP_VERSION=${VERSION}/" .env
          sed -i "s/^NATIVEPHP_APP_VERSION_CODE=.*/NATIVEPHP_APP_VERSION_CODE=${{ github.run_number }}/" .env

          php artisan native:install android --no-interaction

      - name: Prepare signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "Missing ANDROID_KEYSTORE_BASE64. Tag releases require the stable signing secrets." >&2
            exit 1
          fi

          KEYSTORE="$RUNNER_TEMP/fixit-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"

          {
            echo "KEYSTORE_PATH=$KEYSTORE"
            echo "KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Validate signing key
        run: |
          keytool -list -v \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" | grep -E "Alias name|Owner|Valid from" || true

          keytool -certreq \
            -alias "$KEY_ALIAS" \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -file "$RUNNER_TEMP/fixit-ci.csr"

          rm -f "$RUNNER_TEMP/fixit-ci.csr"

      - name: Build signed release APK
        run: |
          php artisan native:package android \
            --build-type=release \
            --keystore="$KEYSTORE_PATH" \
            --keystore-password="$STORE_PASSWORD" \
            --key-alias="$KEY_ALIAS" \
            --key-password="$KEY_PASSWORD" \
            --output=build/android \
            --no-tty \
            --no-interaction

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs build/android/app-release.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APK="build/android/app-release.apk"
          sha256sum "$APK" > "$APK.sha256"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK" "$APK.sha256" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK" "$APK.sha256" \
              --title "FixIt $VERSION" \
              --notes "Signed FixIt release $VERSION. See docs/JUDGE_GUIDE.md. Never share API keys." \
              --latest
          fi
